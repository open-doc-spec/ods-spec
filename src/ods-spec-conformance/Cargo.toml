[package]
name = "ods-spec-conformance"
version = "1.1.0"
edition = "2021"
publish = false
description = "Official Conformance Test Suite for Open Document Spec (ODS 1.1)"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
jsonschema = "0.28"
walkdir = "2.5"
colored = "2.1"
anyhow = "1.0"

[[test]]
name = "conformance"
path = "tests/conformance.rs"
